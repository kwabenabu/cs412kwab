<!-- description: Confirmation page for deleting a card set from the system. -->
{% extends "project/base.html" %}
{% block content %}
<h1>Delete Card Set</h1>
<p>Are you sure you want to delete card set <strong>{{ cardset }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'project:cardset_detail' cardset.pk %}">Cancel</a>
</form>
{% endblock %}
