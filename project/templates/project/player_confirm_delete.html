{% extends "project/base.html" %}
{% block content %}
<h1>Delete Player</h1>
<p>Are you sure you want to delete player <strong>{{ player.full_name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'project:player_detail' player.pk %}">Cancel</a>
</form>
{% endblock %}
