<!-- description: Form for editing a card in the user's collection. -->
{% extends "project/base.html" %}
{% block content %}
<h1>Edit Card in Collection</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
    <a href="{% url 'project:user_collection' %}">Cancel</a>
</form>
{% endblock %}
