{% extends "project/base.html" %}
{% block content %}
<h1>Delete Card</h1>
<p>Are you sure you want to delete card <strong>{{ card }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'project:card_detail' card.pk %}">Cancel</a>
</form>
{% endblock %}
