<!-- description: Form for adding a new card to the user's collection. -->

{% extends "project/base.html" %}
{% block content %}
<h1>Add Card to Collection</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Card</button>
    <a href="{% url 'project:user_collection' %}">Cancel</a>
</form>
{% endblock %}
